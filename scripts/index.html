<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SearXNG Privacy Search Skill</title>
</head>
<body>
<script>
  /**
   * SearXNG Privacy Web Search Skill
   * Uses public SearXNG instances to search the web without tracking.
   * No API key required.
   *
   * Protocol: Google AI Edge Gallery calls window.ai_edge_gallery_get_result(dataString)
   * where dataString is a JSON string with: { query: string, num_results?: number }
   * Returns a JSON string: { result: {...} } or { error: string }
   */

  // Public SearXNG instances to try in order (fallback chain)
  const SEARXNG_INSTANCES = [
    "https://my-searxng-pohz.onrender.com"
  ];

  async function searchSearXNG(query, numResults, instance) {
    const params = new URLSearchParams({
      q: query,
      format: "json",
      categories: "general",
      engines: "google,bing,duckduckgo,brave",
      language: "auto",
      pageno: "1"
    });

    const url = `${instance}/search?${params.toString()}`;

    const response = await fetch(url, {
      method: "GET",
      headers: {
        "Accept": "application/json",
        "User-Agent": "Mozilla/5.0 (compatible; GemmaSkill/1.0)"
      },
      signal: AbortSignal.timeout(8000)
    });

    if (!response.ok) {
      throw new Error(`HTTP ${response.status} from ${instance}`);
    }

    const data = await response.json();

    if (!data.results || data.results.length === 0) {
      throw new Error("No results returned");
    }

    // Normalise results to a clean, compact format
    const results = data.results
      .slice(0, numResults)
      .map(r => ({
        title: (r.title || "").trim(),
        url: r.url || "",
        snippet: (r.content || r.description || "").trim().slice(0, 300)
      }))
      .filter(r => r.title && r.url);

    return {
      query: data.query || query,
      results,
      source: `SearXNG via ${instance} (privacy-preserving meta-search)`
    };
  }

  /**
   * Entry point called by AI Edge Gallery.
   * @param {string} dataString - JSON string with { query, num_results }
   * @returns {string} JSON string with { result } or { error }
   */
  window.ai_edge_gallery_get_result = async function(dataString) {
    let parsed;
    try {
      parsed = JSON.parse(dataString);
    } catch (e) {
      return JSON.stringify({ error: "Invalid input: could not parse JSON — " + e.message });
    }

    const query = (parsed.query || "").trim();
    if (!query) {
      return JSON.stringify({ error: "No search query provided." });
    }

    const numResults = Math.min(Math.max(parseInt(parsed.num_results) || 5, 1), 10);

    // Try each SearXNG instance in order until one works
    let lastError = null;
    for (const instance of SEARXNG_INSTANCES) {
      try {
        const searchResult = await searchSearXNG(query, numResults, instance);
        return JSON.stringify({ result: searchResult });
      } catch (err) {
        lastError = err.message;
        // Try next instance
      }
    }

    return JSON.stringify({
      error: `All SearXNG instances failed. Last error: ${lastError}. The public instances may be temporarily rate-limited — please try again in a few minutes.`
    });
  };
</script>
</body>
</html>
