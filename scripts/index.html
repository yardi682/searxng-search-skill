<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Privacy Web Search Skill</title>
</head>
<body>
<script>
  /**
   * Privacy Web Search Skill for Google AI Edge Gallery
   * 1. Queries self-hosted SearXNG for top results
   * 2. Fetches full page content via self-hosted proxy (no CORS issues)
   * 3. Returns clean text for the model to summarize
   */

  const SEARXNG_URL = "https://my-searxng-pohz.onrender.com";
  const PROXY_URL   = "https://YOUR-PROXY-APP.onrender.com";

  window.ai_edge_gallery_get_result = async function(dataString) {
    try {
      let parsed;
      try {
        parsed = (typeof dataString === "string") ? JSON.parse(dataString) : dataString;
      } catch (e) {
        return JSON.stringify({ error: "Could not parse input JSON: " + e.message });
      }

      const query = String(parsed.query || "").trim();
      if (!query) {
        return JSON.stringify({ error: "No search query provided." });
      }

      const numResults = Math.min(Math.max(parseInt(parsed.num_results) || 5, 1), 5);

      // Step 1: Get top results from SearXNG
      let searchResults;
      try {
        const searchUrl = SEARXNG_URL + "/search?q=" + encodeURIComponent(query) + "&format=json&categories=general&pageno=1";
        const res = await fetch(searchUrl, {
          signal: AbortSignal.timeout(10000),
          headers: { "Accept": "application/json" }
        });
        if (!res.ok) {
          return JSON.stringify({ error: "SearXNG returned HTTP " + res.status });
        }
        const data = await res.json();
        if (!data.results || data.results.length === 0) {
          return JSON.stringify({ error: "No results found for: \"" + query + "\"" });
        }
        searchResults = data.results.slice(0, numResults);
      } catch (e) {
        return JSON.stringify({ error: "Could not reach SearXNG: " + e.message });
      }

      // Step 2: Fetch full content of each page via proxy (parallel)
      const enriched = await Promise.all(
        searchResults.map(async (r) => {
          let fullText = "(Could not fetch page content)";
          try {
            const proxyRes = await fetch(
              PROXY_URL + "/fetch?url=" + encodeURIComponent(r.url),
              { signal: AbortSignal.timeout(10000) }
            );
            if (proxyRes.ok) {
              const data = await proxyRes.json();
              if (data.text) fullText = data.text;
            }
          } catch (e) {
            // Fall back to snippet
          }
          return {
            title: (r.title || "").trim(),
            url: r.url || "",
            snippet: (r.content || r.description || "").trim().slice(0, 300),
            full_text: fullText
          };
        })
      );

      return JSON.stringify({
        result: {
          query: query,
          results: enriched,
          source: "SearXNG (self-hosted, private)",
          instruction: "Read the full_text of each result. Write a 3-5 sentence summary answering the user's query, then list sources as title + URL."
        }
      });

    } catch (outerErr) {
      return JSON.stringify({ error: "Unexpected error: " + outerErr.message });
    }
  };
</script>
</body>
</html>
