<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Privacy Web Search Skill</title>
</head>
<body>
<script>
  /**
   * Privacy Web Search Skill for Google AI Edge Gallery
   * Uses DuckDuckGo's API (no CORS issues, no key needed) as primary,
   * with a SearXNG fallback for full result lists.
   */

  // Wrap everything in try/catch so errors are always returned, never thrown
  window.ai_edge_gallery_get_result = async function(dataString) {
    try {
      let parsed;
      try {
        parsed = (typeof dataString === "string") ? JSON.parse(dataString) : dataString;
      } catch (e) {
        return JSON.stringify({ error: "Could not parse input JSON: " + e.message });
      }

      const query = String(parsed.query || "").trim();
      if (!query) {
        return JSON.stringify({ error: "No search query provided." });
      }

      const numResults = Math.min(Math.max(parseInt(parsed.num_results) || 5, 1), 10);

      // --- Strategy 1: DuckDuckGo Instant Answer API (no CORS, no key) ---
      try {
        const ddgUrl = "https://api.duckduckgo.com/?q=" + encodeURIComponent(query) + "&format=json&no_html=1&skip_disambig=1";
        const ddgRes = await fetch(ddgUrl, { signal: AbortSignal.timeout(6000) });
        if (ddgRes.ok) {
          const ddg = await ddgRes.json();
          const results = [];

          // Abstract (main answer)
          if (ddg.AbstractText) {
            results.push({
              title: ddg.Heading || query,
              url: ddg.AbstractURL || ddg.AbstractSource || "",
              snippet: ddg.AbstractText
            });
          }

          // Related topics
          if (ddg.RelatedTopics && ddg.RelatedTopics.length > 0) {
            for (const t of ddg.RelatedTopics) {
              if (results.length >= numResults) break;
              if (t.Text && t.FirstURL) {
                results.push({
                  title: t.Text.split(" - ")[0] || t.Text.slice(0, 60),
                  url: t.FirstURL,
                  snippet: t.Text
                });
              }
            }
          }

          // Answer (e.g. calculations, conversions)
          if (ddg.Answer) {
            results.unshift({
              title: "Answer",
              url: "",
              snippet: ddg.Answer
            });
          }

          if (results.length > 0) {
            return JSON.stringify({
              result: {
                query: query,
                results: results.slice(0, numResults),
                source: "DuckDuckGo Instant Answers (private, no tracking)"
              }
            });
          }
        }
      } catch (e) {
        // Fall through to next strategy
      }

      // --- Strategy 2: SearXNG public instances with CORS ---
      const instances = [
        "https://searx.be",
        "https://search.inetol.net",
        "https://searx.tiekoetter.com",
        "https://opnxng.com",
        "https://search.sapti.me"
      ];

      for (const instance of instances) {
        try {
          const url = instance + "/search?q=" + encodeURIComponent(query) + "&format=json&categories=general&pageno=1";
          const res = await fetch(url, {
            signal: AbortSignal.timeout(7000),
            headers: { "Accept": "application/json" }
          });
          if (!res.ok) continue;
          const data = await res.json();
          if (!data.results || data.results.length === 0) continue;

          const results = data.results.slice(0, numResults).map(r => ({
            title: (r.title || "").trim(),
            url: r.url || "",
            snippet: (r.content || r.description || "").trim().slice(0, 300)
          })).filter(r => r.title && r.url);

          if (results.length > 0) {
            return JSON.stringify({
              result: {
                query: query,
                results,
                source: "SearXNG via " + instance + " (private, no tracking)"
              }
            });
          }
        } catch (e) {
          continue;
        }
      }

      // --- All strategies failed ---
      return JSON.stringify({
        error: "All search sources failed or returned no results for: \"" + query + "\". This may be a temporary network issue — please try again."
      });

    } catch (outerErr) {
      // Catch-all so the function never crashes silently
      return JSON.stringify({ error: "Unexpected error: " + outerErr.message });
    }
  };
</script>
</body>
</html>
